<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<style>
  :root{
    --primary:#4338f5; --primary2:#6d28d9;
    --bg:#f4f5fb; --card:#ffffff; --text:#111318; --muted:#6b7280;
    --chip:#0f1222; --radius:20px;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px;max-width:560px;margin:0 auto}
  body.dark{--bg:#0e1017;--card:#181b25;--text:#f1f2f6;--muted:#9aa0ae;--chip:#4338f5}

  /* Header */
  header{position:sticky;top:0;z-index:50;background:var(--card);padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 8px rgba(0,0,0,.06)}
  .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
  .brand{font-size:19px;font-weight:800}
  .brand span{color:var(--primary)}
  .hbtns{margin-left:auto;display:flex;gap:6px}
  .hbtn{width:36px;height:36px;border-radius:50%;border:none;background:transparent;font-size:17px;cursor:pointer;color:var(--text)}

  /* Search */
  .searchbar{display:none;padding:10px 16px;background:var(--card)}
  .searchbar.show{display:block}
  .searchbar input{width:100%;padding:11px 16px;border-radius:14px;border:1.5px solid #e2e4ee;background:var(--bg);color:var(--text);font-size:15px;outline:none}

  /* Category chips */
  .chips{display:flex;gap:10px;padding:16px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:10px 20px;border-radius:24px;background:var(--card);border:1px solid #e5e7f0;font-size:14.5px;font-weight:600;cursor:pointer;color:var(--text);white-space:nowrap}
  .chip.active{background:var(--chip);color:#fff;border-color:var(--chip)}

  /* Sections */
  .section-title{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:800;padding:8px 16px 14px}
  .section-title .ico{width:34px;height:34px;border-radius:10px;background:#ffe9d6;display:flex;align-items:center;justify-content:center;font-size:17px}

  /* Trending row */
  .trow{display:flex;gap:14px;overflow-x:auto;padding:2px 16px 8px;scrollbar-width:none}
  .trow::-webkit-scrollbar{display:none}
  .trow .card{flex:0 0 78%}

  /* Cards */
  .list{padding:0 16px;display:flex;flex-direction:column;gap:18px}
  .card{background:var(--card);border-radius:var(--radius);padding:12px;box-shadow:0 2px 14px rgba(20,20,60,.07)}
  .thumbwrap{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/10;background:#dfe2ef}
  .thumbwrap img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:40px;background:linear-gradient(135deg,#c7cbf5,#e8e9fb)}
  .playbtn{position:absolute;inset:0;margin:auto;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--primary)}
  .badge-top{position:absolute;top:10px;left:10px;background:linear-gradient(135deg,#ff6a00,#ff2d55);color:#fff;font-size:12px;font-weight:700;padding:5px 10px;border-radius:10px}
  .stat{position:absolute;bottom:10px;font-size:12px;font-weight:600;color:#fff;background:rgba(15,17,30,.72);padding:5px 10px;border-radius:20px;display:flex;align-items:center;gap:5px}
  .stat.views{left:10px}.stat.dls{right:10px;background:rgba(16,120,60,.85)}
  .card h3{font-size:16.5px;font-weight:700;margin:12px 4px 4px;line-height:1.35}
  .card .desc{font-size:13px;color:var(--muted);margin:0 4px 10px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cta{width:100%;padding:14px;border:none;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:15.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
  .cta:active{transform:scale(.97)}
  .cta.done{background:linear-gradient(135deg,#059669,#10b981)}

  .empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:15px}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(10,12,25,.55);z-index:100;display:none;align-items:flex-end;justify-content:center}
  .overlay.show{display:flex}
  .modal{background:var(--card);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:22px 18px 30px;animation:up .25s ease}
  @keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
  .modal h2{font-size:19px;margin-bottom:16px}
  .modal label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin:12px 0 5px}
  .modal input,.modal textarea,.modal select{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid #e2e4ee;background:var(--bg);color:var(--text);font-size:14.5px;outline:none}
  .modal textarea{resize:vertical;min-height:70px}
  .btnrow{display:flex;gap:10px;margin-top:18px}
  .btn{flex:1;padding:13px;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer}
  .btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
  .btn.ghost{background:var(--bg);color:var(--text)}
  .btn.danger{background:#fee2e2;color:#dc2626}

  /* Unlock progress modal */
  .unlock-box{text-align:center;padding:10px 6px}
  .unlock-box .lockico{font-size:46px;margin-bottom:10px}
  .unlock-box p{color:var(--muted);font-size:14px;margin:8px 0 18px;line-height:1.5}
  .dots{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
  .dot{width:14px;height:14px;border-radius:50%;background:#e2e4ee}
  .dot.on{background:linear-gradient(135deg,var(--primary),var(--primary2))}

  /* Admin */
  .admin-fab{position:fixed;bottom:22px;right:18px;z-index:60;width:56px;height:56px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:24px;cursor:pointer;box-shadow:0 6px 20px rgba(67,56,245,.4);display:none}
  .admin-list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eceef5}
  .admin-list-item .t{flex:1;font-size:14px;font-weight:600}
  .mini{padding:7px 12px;border-radius:10px;border:none;font-size:12.5px;font-weight:700;cursor:pointer}
  .mini.edit{background:#e0e7ff;color:#4338f5}.mini.del{background:#fee2e2;color:#dc2626}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:#111827;color:#fff;padding:12px 22px;border-radius:14px;font-size:14px;z-index:200;transition:transform .3s;max-width:90vw;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>

<div class="toast" id="toast"></div>

<script>
/* ---------- Telegram init ---------- */
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const tgUserId = String(tg?.initDataUnsafe?.user?.id || "");

/* ---------- Supabase ---------- */
const DEMO = CONFIG.SUPABASE_URL.startsWith("YOUR_");
let sb = null;
if (!DEMO) sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

/* ---------- Monetag SDK loader ---------- */
let adFn = null;
if (!String(CONFIG.MONETAG_ZONE_ID).startsWith("YOUR_")) {
  const s = document.createElement("script");
  s.src = "https://libtl.com/sdk.js";
  s.dataset.zone = CONFIG.MONETAG_ZONE_ID;
  s.dataset.sdk = "show_" + CONFIG.MONETAG_ZONE_ID;
  s.onload = () => {
    adFn = window["show_" + CONFIG.MONETAG_ZONE_ID];
    // In-App Interstitial (স্বয়ংক্রিয় এড)
    if (CONFIG.ENABLE_INAPP_ADS && adFn) {
      adFn({ type: "inApp", inAppSettings: { frequency: 2, capping: 0.1, interval: 30, timeout: 5, everyPage: false } });
    }
  };
  document.head.appendChild(s);
}

/* ---------- State ---------- */
let posts = [], cats = [], activeCat = "all", currentUnlockPost = null;
const demoData = () => {
  posts = [
    { id: 1, title: "ডেমো পোস্ট ১ (৮ মিনিট ২১ সেকেন্ড)", description: "এটি একটি ডেমো পোস্ট — Supabase কানেক্ট করলে আসল ডাটা দেখাবে।", thumbnail_url: "", link_url: "https://example.com", category_id: null, is_trending: true, views: 22100, downloads: 40500 },
    { id: 2, title: "ডেমো পোস্ট ২ (৩ ভিডিও)", description: "ডেমো বর্ণনা।", thumbnail_url: "", link_url: "https://example.com", category_id: null, is_trending: false, views: 137, downloads: 168 }
  ];
  cats = [{ id: 1, name: "Hot 🥵" }, { id: 2, name: "Trending🔥" }];
};

async function loadData() {
  if (DEMO) { demoData(); render(); return; }
  const [p, c] = await Promise.all([
    sb.from("posts").select("*").order("created_at", { ascending: false }),
    sb.from("categories").select("*").order("id")
  ]);
  if (p.error || c.error) { showToast("ডাটা লোডে সমস্যা: " + (p.error || c.error).message); return; }
  posts = p.data; cats = c.data; render();
}

/* ---------- Helpers ---------- */
const fmt = n => n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, "") + "k" : String(n);
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
function showToast(m) { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2600); }
function closeOverlay(id) { document.getElementById(id).classList.remove("show"); }
function toggleSearch() { document.getElementById("searchbar").classList.toggle("show"); }
function toggleDark() { document.body.classList.toggle("dark"); }

/* ---------- Render ---------- */
function render() {
  // chips
  const chipsEl = document.getElementById("chips");
  chipsEl.innerHTML = `<div class="chip ${activeCat === "all" ? "active" : ""}" onclick="setCat('all')">All Videos</div>` +
    cats.map(c => `<div class="chip ${activeCat == c.id ? "active" : ""}" onclick="setCat(${c.id})">${esc(c.name)}</div>`).join("");

  const q = (document.getElementById("searchInput").value || "").toLowerCase();
  const filtered = posts.filter(p =>
    (activeCat === "all" || p.category_id == activeCat) &&
    (!q || (p.title || "").toLowerCase().includes(q)));

  // trending
  const trending = filtered.filter(p => p.is_trending);
  document.getElementById("trendingSection").style.display = trending.length ? "" : "none";
  document.getElementById("trendingRow").innerHTML = trending.map((p, i) => cardHTML(p, i + 1)).join("");

  // latest
  const listEl = document.getElementById("list");
  listEl.innerHTML = filtered.map(p => cardHTML(p)).join("");
  document.getElementById("empty").style.display = filtered.length ? "none" : "";

  // admin fab
  const isAdmin = tgUserId && tgUserId === String(CONFIG.ADMIN_TELEGRAM_ID) || new URLSearchParams(location.search).get("admin") === "1";
  document.getElementById("adminFab").style.display = isAdmin ? "block" : "none";
}
function setCat(id) { activeCat = id; render(); }

function cardHTML(p, topRank) {
  const prog = getProgress(p.id);
  const unlocked = prog >= CONFIG.ADS_REQUIRED;
  const thumb = p.thumbnail_url
    ? `<img src="${esc(p.thumbnail_url)}" loading="lazy" onerror="this.outerHTML='<div class=thumb-ph>🎬</div>'" />`
    : `<div class="thumb-ph">🎬</div>`;
  return `<div class="card">
    <div class="thumbwrap">${thumb}
      ${topRank ? `<div class="badge-top">🔥 Top ${topRank}</div>` : ""}
      <div class="playbtn">▶</div>
      <div class="stat views">👁 ${fmt(p.views || 0)}</div>
      <div class="stat dls">⬇ ${fmt(p.downloads || 0)}</div>
    </div>
    <h3>${esc(p.title)}</h3>
    ${p.description ? `<div class="desc">${esc(p.description)}</div>` : ""}
    <button class="cta ${unlocked ? "done" : ""}" onclick="startUnlock(${p.id})">
      ${unlocked ? "✅ Watch & Download" : `🔒 Unlock Link (${prog}/${CONFIG.ADS_REQUIRED})`}
    </button>
  </div>`;
}

/* ---------- Unlock flow ---------- */
const getProgress = id => Number(localStorage.getItem("unlock_" + id) || 0);
const setProgress = (id, v) => localStorage.setItem("unlock_" + id, String(v));

function startUnlock(id) {
  const p = posts.find(x => x.id == id);
  if (!p) return;
  currentUnlockPost = p;
  if (getProgress(id) >= CONFIG.ADS_REQUIRED) { goToLink(p); return; }
  updateUnlockModal();
  document.getElementById("unlockOverlay").classList.add("show");
}

function updateUnlockModal() {
  const p = currentUnlockPost, prog = getProgress(p.id);
  document.getElementById("unlockTitle").textContent = prog >= CONFIG.ADS_REQUIRED ? "🎉 আনলক সম্পন্ন!" : "লিংক আনলক করুন";
  document.getElementById("unlockText").textContent =
    prog >= CONFIG.ADS_REQUIRED
      ? "লিংক খোলা হচ্ছে..."
      : `লিংকটি পেতে ${CONFIG.ADS_REQUIRED}টি এড দেখুন। আর ${CONFIG.ADS_REQUIRED - prog}টি বাকি।`;
  document.getElementById("unlockDots").innerHTML =
    Array.from({ length: CONFIG.ADS_REQUIRED }, (_, i) => `<div class="dot ${i < prog ? "on" : ""}"></div>`).join("");
  document.getElementById("watchAdBtn").style.display = prog >= CONFIG.ADS_REQUIRED ? "none" : "";
}

function watchAd() {
  const btn = document.getElementById("watchAdBtn");
  btn.disabled = true; btn.textContent = "এড লোড হচ্ছে...";
  const after = () => {
    btn.disabled = false; btn.textContent = "📺 এড দেখুন";
    const p = currentUnlockPost;
    setProgress(p.id, getProgress(p.id) + 1);
    updateUnlockModal(); render();
    if (getProgress(p.id) >= CONFIG.ADS_REQUIRED) setTimeout(() => goToLink(p), 800);
  };
  if (adFn) {
    // Rewarded interstitial — এড শেষ হলে প্রগ্রেস বাড়বে
    adFn().then(after).catch(() => { btn.disabled = false; btn.textContent = "📺 এড দেখুন"; showToast("এড লোড হয়নি, আবার চেষ্টা করুন"); });
  } else {
    showToast("ডেমো মোড: Monetag zone id বসালে আসল এড দেখাবে");
    setTimeout(after, 800);
  }
}

async function goToLink(p) {
  closeOverlay("unlockOverlay");
  if (!DEMO) sb.rpc("increment_downloads", { post_id: p.id }).then(() => {});
  p.downloads = (p.downloads || 0) + 1; render();
  if (tg?.openLink) tg.openLink(p.link_url); else window.open(p.link_url, "_blank");
}

/* ---------- Views count (once per session per post) ---------- */
const counted = new Set();
document.addEventListener("click", e => {
  const card = e.target.closest(".card"); if (!card) return;
}, true);

/* ---------- Admin ---------- */
async function openAdmin() {
  document.getElementById("adminOverlay").classList.add("show");
  if (DEMO) { document.getElementById("adminMain").style.display = ""; renderAdmin(); return; }
  const { data } = await sb.auth.getSession();
  if (data.session) { document.getElementById("adminMain").style.display = ""; document.getElementById("adminLogin").style.display = "none"; renderAdmin(); }
  else { document.getElementById("adminLogin").style.display = ""; document.getElementById("adminMain").style.display = "none"; }
}
async function adminLogin() {
  const { error } = await sb.auth.signInWithPassword({
    email: document.getElementById("loginEmail").value.trim(),
    password: document.getElementById("loginPass").value
  });
  if (error) { showToast("লগইন ব্যর্থ: " + error.message); return; }
  showToast("লগইন সফল ✅"); openAdmin();
}
function renderAdmin() {
  document.getElementById("adminPosts").innerHTML = posts.map(p =>
    `<div class="admin-list-item"><div class="t">${esc(p.title)}</div>
      <button class="mini edit" onclick="openPostForm(${p.id})">এডিট</button>
      <button class="mini del" onclick="deletePost(${p.id})">ডিলিট</button></div>`).join("") || "<div class='empty'>কোনো পোস্ট নেই</div>";
  document.getElementById("adminCats").innerHTML = cats.map(c =>
    `<div class="admin-list-item"><div class="t">${esc(c.name)}</div>
      <button class="mini del" onclick="deleteCat(${c.id})">ডিলিট</button></div>`).join("") || "<div class='empty'>কোনো ক্যাটাগরি নেই</div>";
}
function openPostForm(id) {
  const p = id ? posts.find(x => x.id == id) : null;
  document.getElementById("postFormTitle").textContent = p ? "পোস্ট এডিট" : "নতুন পোস্ট";
  document.getElementById("pfId").value = p ? p.id : "";
  document.getElementById("pfTitle").value = p?.title || "";
  document.getElementById("pfDesc").value = p?.description || "";
  document.getElementById("pfThumb").value = p?.thumbnail_url || "";
  document.getElementById("pfLink").value = p?.link_url || "";
  document.getElementById("pfTrending").value = String(p?.is_trending || false);
  document.getElementById("pfViews").value = p?.views || 0;
  document.getElementById("pfDls").value = p?.downloads || 0;
  document.getElementById("pfCat").innerHTML = `<option value="">— নেই —</option>` +
    cats.map(c => `<option value="${c.id}" ${p?.category_id == c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("");
  document.getElementById("postOverlay").classList.add("show");
}
async function savePost() {
  const id = document.getElementById("pfId").value;
  const row = {
    title: document.getElementById("pfTitle").value.trim(),
    description: document.getElementById("pfDesc").value.trim(),
    thumbnail_url: document.getElementById("pfThumb").value.trim(),
    link_url: document.getElementById("pfLink").value.trim(),
    category_id: document.getElementById("pfCat").value || null,
    is_trending: document.getElementById("pfTrending").value === "true",
    views: Number(document.getElementById("pfViews").value || 0),
    downloads: Number(document.getElementById("pfDls").value || 0)
  };
  if (!row.title || !row.link_url) { showToast("শিরোনাম ও লিংক আবশ্যক"); return; }
  if (DEMO) { showToast("ডেমো মোড: Supabase কানেক্ট করুন"); return; }
  const q = id ? sb.from("posts").update(row).eq("id", id) : sb.from("posts").insert(row);
  const { error } = await q;
  if (error) { showToast("সেভ ব্যর্থ: " + error.message); return; }
  showToast("সেভ হয়েছে ✅"); closeOverlay("postOverlay"); await loadData(); renderAdmin();
}
async function deletePost(id) {
  if (!confirm("পোস্টটি ডিলিট করবেন?")) return;
  if (DEMO) { showToast("ডেমো মোড"); return; }
  const { error } = await sb.from("posts").delete().eq("id", id);
  if (error) { showToast("ডিলিট ব্যর্থ: " + error.message); return; }
  await loadData(); renderAdmin();
}
function openCatForm() { document.getElementById("cfName").value = ""; document.getElementById("catOverlay").classList.add("show"); }
async function saveCat() {
  const name = document.getElementById("cfName").value.trim();
  if (!name) return;
  if (DEMO) { showToast("ডেমো মোড"); return; }
  const { error } = await sb.from("categories").insert({ name });
  if (error) { showToast("সেভ ব্যর্থ: " + error.message); return; }
  closeOverlay("catOverlay"); await loadData(); renderAdmin();
}
async function deleteCat(id) {
  if (!confirm("ক্যাটাগরিটি ডিলিট করবেন?")) return;
  if (DEMO) { showToast("ডেমো মোড"); return; }
  const { error } = await sb.from("categories").delete().eq("id", id);
  if (error) { showToast("ডিলিট ব্যর্থ: " + error.message); return; }
  await loadData(); renderAdmin();
}

/* ---------- Start ---------- */
loadData();
</script>
