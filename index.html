<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let allPosts = [];
let currentUserId = 'unknown';
let unlockData = {};

window.addEventListener('DOMContentLoaded', async () => {
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.expand();
    currentUserId = tg.initDataUnsafe?.user?.id?.toString() || 'unknown';
  }
  if (currentUserId === ADMIN_TELEGRAM_ID) document.getElementById('admin-btn').classList.remove('hidden');
  await loadPosts();
});

async function loadPosts() {
  const { data: posts } = await sb.from('posts').select('*').order('created_at', {ascending: false});
  const { data: progress } = await sb.from('ad_watches').select('*').eq('telegram_user_id', currentUserId);
  
  if (posts) allPosts = posts;
  if (progress) progress.forEach(p => unlockData[p.post_id] = p);
  renderFeed();
}

function renderFeed() {
  const feed = document.getElementById('feed');
  feed.innerHTML = allPosts.map(p => {
    const prog = unlockData[p.id] || { ad_count: 0, unlocked: false };
    return `
      <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100">
        <img src="${p.thumbnail_url}" class="w-full aspect-video object-cover" onclick="handleUnlock(${p.id})">
        <div class="p-4">
          <h3 class="font-bold mb-3 text-sm line-clamp-2">${p.title}</h3>
          ${prog.unlocked ? 
            `<a href="${p.target_url}" target="_blank" class="block w-full py-3 bg-green-500 text-white text-center rounded-xl font-bold shadow-lg">Watch Now ✅</a>` :
            `<button onclick="handleUnlock(${p.id})" class="w-full py-3 bg-blue-600 text-white rounded-xl font-bold shadow-lg">🔓 Unlock Link (${prog.ad_count}/${ADS_REQUIRED})</button>`
          }
        </div>
      </div>`;
  }).join('');
}

// এই ফাংশনটি ক্লিক করলে Monetag-এর অ্যাড দেখাবে
async function handleUnlock(postId) {
  // ১. Monetag ইন্টারস্টিশিয়াল অ্যাড ট্রিগার করা
  if (typeof window.show_8961314 === 'function') { // Monetag function (if available)
      window.show_8961314();
  } else {
      // যদি স্ক্রিপ্ট সরাসরি বাটন ডিটেক্ট না করে তবে পপ-আপ হিসেবে খুলবে
      window.open(`https://groleegni.net/401/${MONETAG_ZONE_ID}`, '_blank');
  }

  // ২. ডাটাবেসে কাউন্ট আপডেট করা (অ্যাড দেখানোর পর)
  let prog = unlockData[postId] || { ad_count: 0, unlocked: false };
  prog.ad_count++;
  
  if (prog.ad_count >= ADS_REQUIRED) {
    prog.unlocked = true;
  }

  const { error } = await sb.from('ad_watches').upsert({ 
    telegram_user_id: currentUserId, 
    post_id: postId, 
    ad_count: prog.ad_count, 
    unlocked: prog.unlocked 
  }, { onConflict: 'telegram_user_id,post_id' });

  if (!error) {
    unlockData[postId] = prog;
    renderFeed();
    if(prog.unlocked) alert("অভিনন্দন! লিঙ্ক আনলক হয়েছে।");
    else alert(`অ্যাড সফল হয়েছে! আর ${ADS_REQUIRED - prog.ad_count} টি অ্যাড দেখুন।`);
  }
}

// Search and Admin Functions
function handleSearch() {
  const query = document.getElementById('search-input').value.toLowerCase();
  const filtered = allPosts.filter(p => p.title.toLowerCase().includes(query));
  const feed = document.getElementById('feed');
  // Re-render feed with filtered posts...
}

function openAdmin() { document.getElementById('admin-modal').classList.remove('hidden'); loadAdminList(); }
function closeAdmin() { document.getElementById('admin-modal').classList.add('hidden'); }

async function submitPost() {
  const title = document.getElementById('f-title').value;
  const thumb = document.getElementById('f-thumb').value;
  const url = document.getElementById('f-url').value;
  if(!title || !thumb || !url) return alert("Fill all fields");
  await sb.from('posts').insert([{ title, thumbnail_url: thumb, target_url: url }]);
  location.reload();
}

async function loadAdminList() {
  const { data } = await sb.from('posts').select('*').order('created_at', {ascending: false});
  document.getElementById('admin-list').innerHTML = data.map(p => `
    <div class="p-3 bg-gray-50 flex justify-between items-center rounded-lg border">
      <span class="text-xs font-bold truncate w-40">${p.title}</span>
      <button onclick="deletePost(${p.id})" class="text-red-500 text-sm">Delete</button>
    </div>`).join('');
}

async function deletePost(id) {
    if(confirm("Delete this post?")) {
        await sb.from('posts').delete().eq('id', id);
        loadAdminList();
    }
}
</script>
