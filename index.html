<style>
  :root{
    --primary:#4f46e5; --primary2:#7c3aed; --accent:#f59e0b;
    --bg:#f6f7fb; --card:#ffffff; --text:#0f172a; --muted:#64748b;
    --line:#e8eaf2; --chip:#0f172a; --radius:18px;
    --shadow:0 4px 24px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.05);
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);min-height:100vh;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
  body.dark{--bg:#0b0e17;--card:#151926;--text:#eef0f7;--muted:#8b93a7;--line:#232a3d;--chip:#4f46e5;--shadow:0 4px 24px rgba(0,0,0,.35)}
  main{flex:1}
  svg{display:block}

  /* Header */
  header{position:sticky;top:0;z-index:50;background:var(--card);padding:13px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line)}
  .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(79,70,229,.35)}
  .brand{font-size:18px;font-weight:800;letter-spacing:-.3px}
  .brand span{background:linear-gradient(135deg,var(--primary),var(--primary2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hbtns{margin-left:auto;display:flex;gap:4px}
  .hbtn{width:38px;height:38px;border-radius:12px;border:none;background:transparent;cursor:pointer;color:var(--text);display:flex;align-items:center;justify-content:center;transition:background .15s}
  .hbtn:active{background:var(--bg)}

  /* Search */
  .searchbar{display:none;padding:12px 16px 2px}
  .searchbar.show{display:block}
  .searchwrap{position:relative}
  .searchwrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.45}
  .searchbar input{width:100%;padding:12px 16px 12px 42px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font-size:14.5px;outline:none;transition:border .15s}
  .searchbar input:focus{border-color:var(--primary)}

  /* Category chips */
  .chips{display:flex;gap:9px;padding:14px 16px 4px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:9px 18px;border-radius:22px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:600;cursor:pointer;color:var(--text);white-space:nowrap;transition:all .15s}
  .chip.active{background:var(--chip);color:#fff;border-color:var(--chip);box-shadow:0 4px 12px rgba(15,23,42,.2)}

  /* Sections */
  .section-title{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:800;letter-spacing:-.4px;padding:16px 16px 12px}
  .section-title .ico{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fff3e0,#ffe0e0);font-size:15px}
  body.dark .section-title .ico{background:linear-gradient(135deg,#3a2c14,#3a1a1a)}

  /* Trending row */
  .trow{display:flex;gap:13px;overflow-x:auto;padding:2px 16px 10px;scrollbar-width:none;scroll-snap-type:x mandatory}
  .trow::-webkit-scrollbar{display:none}
  .trow .card{flex:0 0 76%;scroll-snap-align:start}

  /* Cards */
  .list{padding:0 16px;display:flex;flex-direction:column;gap:16px}
  .card{background:var(--card);border-radius:var(--radius);padding:10px;box-shadow:var(--shadow);border:1px solid var(--line);animation:fadeUp .35s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .thumbwrap{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:16/10;background:linear-gradient(135deg,#e4e6f5,#f0f1fa)}
  body.dark .thumbwrap{background:linear-gradient(135deg,#1c2133,#232a41)}
  .thumbwrap img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);opacity:.5}
  .playbtn{position:absolute;inset:0;margin:auto;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.92);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;color:var(--primary);box-shadow:0 4px 16px rgba(0,0,0,.18)}
  .badge-top{position:absolute;top:10px;left:10px;background:linear-gradient(135deg,#f97316,#ef4444);color:#fff;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:9px;box-shadow:0 3px 10px rgba(239,68,68,.35)}
  .stat{position:absolute;bottom:10px;font-size:11.5px;font-weight:600;color:#fff;background:rgba(10,13,25,.68);backdrop-filter:blur(6px);padding:5px 10px;border-radius:20px;display:flex;align-items:center;gap:5px}
  .stat.views{left:10px}.stat.dls{right:10px;background:rgba(5,110,60,.8)}
  .card h3{font-size:15.5px;font-weight:700;margin:12px 5px 4px;line-height:1.35;letter-spacing:-.2px}
  .card .desc{font-size:12.5px;color:var(--muted);margin:0 5px 10px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cta{width:100%;padding:13px;border:none;border-radius:13px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:14.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,box-shadow .15s;box-shadow:0 4px 14px rgba(79,70,229,.3);font-family:inherit}
  .cta:active{transform:scale(.97)}
  .cta.done{background:linear-gradient(135deg,#059669,#10b981);box-shadow:0 4px 14px rgba(16,185,129,.3)}

  .empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:14.5px}

  /* Skeleton */
  .skel .thumbwrap,.skel .sk-line{position:relative;overflow:hidden}
  .sk-line{height:14px;border-radius:7px;background:var(--line);margin:12px 5px 8px}
  .sk-line.short{width:55%}
  .sk-btn{height:46px;border-radius:13px;background:var(--line)}
  .skel .thumbwrap::after,.sk-line::after,.sk-btn{animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

  /* Footer */
  footer{margin-top:34px;padding:24px 16px 30px;text-align:center;border-top:1px solid var(--line)}
  footer .fbrand{font-weight:800;font-size:15px;margin-bottom:5px}
  footer p{font-size:12px;color:var(--muted);line-height:1.6}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(8,10,22,.55);backdrop-filter:blur(3px);z-index:100;display:none;align-items:flex-end;justify-content:center}
  .overlay.show{display:flex}
  .modal{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:10px 18px 30px;animation:up .28s cubic-bezier(.2,.9,.3,1)}
  @keyframes up{from{transform:translateY(70px);opacity:0}to{transform:none;opacity:1}}
  .grab{width:42px;height:4px;border-radius:3px;background:var(--line);margin:4px auto 16px}
  .modal h2{font-size:18px;margin-bottom:14px;letter-spacing:-.3px}
  .modal label{font-size:12.5px;font-weight:600;color:var(--muted);display:block;margin:12px 0 5px}
  .modal input,.modal textarea,.modal select{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);font-size:14px;outline:none;font-family:inherit}
  .modal input:focus,.modal textarea:focus{border-color:var(--primary)}
  .modal textarea{resize:vertical;min-height:70px}
  .btnrow{display:flex;gap:10px;margin-top:18px}
  .btn{flex:1;padding:13px;border:none;border-radius:13px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .12s}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.3)}
  .btn.ghost{background:var(--bg);color:var(--text);border:1px solid var(--line)}

  /* Unlock */
  .unlock-box{text-align:center;padding:6px 4px}
  .lockring{width:76px;height:76px;border-radius:50%;margin:6px auto 14px;background:linear-gradient(135deg,#eef0ff,#f5edff);display:flex;align-items:center;justify-content:center;color:var(--primary)}
  body.dark .lockring{background:linear-gradient(135deg,#1d2140,#2a1d40)}
  .unlock-box p{color:var(--muted);font-size:13.5px;margin:8px 0 18px;line-height:1.55}
  .dots{display:flex;gap:10px;justify-content:center;margin-bottom:22px}
  .dot{width:13px;height:13px;border-radius:50%;background:var(--line);transition:all .25s}
  .dot.on{background:linear-gradient(135deg,var(--primary),var(--primary2));transform:scale(1.15);box-shadow:0 2px 8px rgba(79,70,229,.4)}

  /* Admin */
  .admin-fab{position:fixed;bottom:22px;right:calc(50% - 280px + 18px);z-index:60;width:54px;height:54px;border-radius:18px;border:none;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:26px;cursor:pointer;box-shadow:0 8px 24px rgba(79,70,229,.45);display:none}
  @media(max-width:560px){.admin-fab{right:18px}}
  .admin-list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .admin-list-item .t{flex:1;font-size:13.5px;font-weight:600}
  .mini{padding:7px 13px;border-radius:10px;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
  .mini.edit{background:#e0e7ff;color:#4338f5}.mini.del{background:#fee2e2;color:#dc2626}
  body.dark .mini.edit{background:#272c55;color:#a5b4fc}
  body.dark .mini.del{background:#451c1c;color:#fca5a5}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(90px);background:#111827;color:#fff;padding:12px 22px;border-radius:14px;font-size:13.5px;z-index:200;transition:transform .3s;max-width:88vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>

<script>
/* ---------- Telegram init ---------- */
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const tgUserId = String(tg?.initDataUnsafe?.user?.id || "");

/* ---------- Supabase ---------- */
const DEMO = CONFIG.SUPABASE_URL.startsWith("YOUR_");
let sb = null;
if (!DEMO) sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

/* ---------- Monetag SDK (resolved at call time) ---------- */
let sdkReady = false, sdkFailed = false;
if (!String(CONFIG.MONETAG_ZONE_ID).startsWith("YOUR_")) {
  const s = document.createElement("script");
  s.src = "https://libtl.com/sdk.js";
  s.dataset.zone = CONFIG.MONETAG_ZONE_ID;
  s.dataset.sdk = "show_" + CONFIG.MONETAG_ZONE_ID;
  s.onload = () => { sdkReady = true; maybeStartInAppAds(); };
  s.onerror = () => { sdkFailed = true; };
  document.head.appendChild(s);
} else { sdkFailed = true; }
function getAdFn() { return window["show_" + CONFIG.MONETAG_ZONE_ID] || null; }
function waitForSdk(timeoutMs = 8000) {
  return new Promise(resolve => {
    if (getAdFn()) return resolve(getAdFn());
    if (sdkFailed) return resolve(null);
    const t0 = Date.now();
    const iv = setInterval(() => {
      if (getAdFn()) { clearInterval(iv); resolve(getAdFn()); }
      else if (sdkFailed || Date.now() - t0 > timeoutMs) { clearInterval(iv); resolve(getAdFn()); }
    }, 150);
  });
}

/* ---------- Overlay stack + Back button ---------- */
const ovStack = [];
function openOverlay(id, before) {
  if (before) before();
  document.getElementById(id).classList.add("show");
  ovStack.push(id);
  history.pushState({ ov: id }, "");
  updateBackBtn();
}
function closeTopOverlay() { if (ovStack.length) history.back(); }
window.addEventListener("popstate", () => {
  const id = ovStack.pop();
  if (id) document.getElementById(id).classList.remove("show");
  updateBackBtn();
});
function updateBackBtn() {
  if (!tg?.BackButton) return;
  if (ovStack.length) tg.BackButton.show(); else tg.BackButton.hide();
}
if (tg?.BackButton) tg.BackButton.onClick(() => closeTopOverlay());
// close on backdrop tap
document.querySelectorAll(".overlay").forEach(ov =>
  ov.addEventListener("click", e => { if (e.target === ov) closeTopOverlay(); }));

/* ---------- Settings ---------- */
let settings = { ads_required: CONFIG.ADS_REQUIRED, inapp_ads: CONFIG.ENABLE_INAPP_ADS };
let inAppStarted = false;
function maybeStartInAppAds() {
  const fn = getAdFn();
  if (!inAppStarted && settings.inapp_ads && fn) {
    inAppStarted = true;
    fn({ type: "inApp", inAppSettings: { frequency: 2, capping: 0.1, interval: 30, timeout: 5, everyPage: false } });
  }
}
async function loadSettings() {
  if (DEMO) return;
  const { data, error } = await sb.from("settings").select("*");
  if (error || !data) return;
  const map = Object.fromEntries(data.map(r => [r.key, r.value]));
  if (map.ads_required) settings.ads_required = Math.max(1, Number(map.ads_required) || CONFIG.ADS_REQUIRED);
  if (map.inapp_ads !== undefined) settings.inapp_ads = map.inapp_ads === "true";
  maybeStartInAppAds();
}
async function saveSettings() {
  const adsReq = document.getElementById("setAdsRequired").value;
  const inApp = document.getElementById("setInApp").value;
  if (DEMO) { showToast("Demo mode"); return; }
  const { error } = await sb.from("settings").upsert([
    { key: "ads_required", value: String(adsReq) },
    { key: "inapp_ads", value: inApp }
  ]);
  if (error) { showToast("Save failed: " + error.message); return; }
  settings.ads_required = Number(adsReq);
  settings.inapp_ads = inApp === "true";
  showToast("Settings saved");
  render();
}

/* ---------- State ---------- */
let posts = [], cats = [], activeCat = "all", currentUnlockPost = null;
const demoData = () => {
  posts = [
    { id: 1, title: "Demo Post 1 (8 min 21 sec)", description: "This is a demo post — connect Supabase to load real data.", thumbnail_url: "", link_url: "https://example.com", category_id: null, is_trending: true, views: 22100, downloads: 40500 },
    { id: 2, title: "Demo Post 2 (3 videos)", description: "Demo description.", thumbnail_url: "", link_url: "https://example.com", category_id: null, is_trending: false, views: 137, downloads: 168 }
  ];
  cats = [{ id: 1, name: "Hot 🥵" }, { id: 2, name: "Trending 🔥" }];
};

async function loadData() {
  if (DEMO) { demoData(); render(); return; }
  const [p, c] = await Promise.all([
    sb.from("posts").select("*").order("created_at", { ascending: false }),
    sb.from("categories").select("*").order("id")
  ]);
  if (p.error || c.error) { showToast("Failed to load data: " + (p.error || c.error).message); return; }
  posts = p.data; cats = c.data; render();
}

/* ---------- Helpers ---------- */
const fmt = n => n >= 1000000 ? (n / 1000000).toFixed(1).replace(/\.0$/, "") + "M" : n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, "") + "k" : String(n);
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
function showToast(m) { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2800); }
function toggleSearch() { document.getElementById("searchbar").classList.toggle("show"); document.getElementById("searchInput").focus(); }
function toggleDark() { document.body.classList.toggle("dark"); localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light"); }
if (localStorage.getItem("theme") === "dark") document.body.classList.add("dark");

const ICON_EYE = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>`;
const ICON_DL = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 4v11m0 0 4-4m-4 4-4-4M4 20h16"/></svg>`;
const ICON_LOCK = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>`;
const ICON_CHECK = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="m4.5 12.5 5 5 10-11"/></svg>`;
const ICON_PLAY = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
const ICON_FILM = `<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>`;

/* ---------- Render ---------- */
function render() {
  const chipsEl = document.getElementById("chips");
  chipsEl.innerHTML = `<div class="chip ${activeCat === "all" ? "active" : ""}" onclick="setCat('all')">All Videos</div>` +
    cats.map(c => `<div class="chip ${activeCat == c.id ? "active" : ""}" onclick="setCat(${c.id})">${esc(c.name)}</div>`).join("");

  const q = (document.getElementById("searchInput").value || "").toLowerCase();
  const filtered = posts.filter(p =>
    (activeCat === "all" || p.category_id == activeCat) &&
    (!q || (p.title || "").toLowerCase().includes(q)));

  const trending = filtered.filter(p => p.is_trending);
  document.getElementById("trendingSection").style.display = trending.length ? "" : "none";
  document.getElementById("trendingRow").innerHTML = trending.map((p, i) => cardHTML(p, i + 1)).join("");

  document.getElementById("list").innerHTML = filtered.map(p => cardHTML(p)).join("");
  document.getElementById("empty").style.display = filtered.length ? "none" : "";

  const isAdmin = (tgUserId && tgUserId === String(CONFIG.ADMIN_TELEGRAM_ID)) || new URLSearchParams(location.search).get("admin") === "1";
  document.getElementById("adminFab").style.display = isAdmin ? "block" : "none";
}
function setCat(id) { activeCat = id; render(); }

function cardHTML(p, topRank) {
  const REQ = settings.ads_required;
  const prog = getProgress(p.id);
  const unlocked = prog >= REQ;
  const busy = adBusyPostId == p.id;
  const thumb = p.thumbnail_url
    ? `<img src="${esc(p.thumbnail_url)}" loading="lazy" onerror="this.outerHTML='<div class=thumb-ph>${ICON_FILM.replace(/"/g, "&quot;")}</div>'" />`
    : `<div class="thumb-ph">${ICON_FILM}</div>`;
  return `<div class="card">
    <div class="thumbwrap">${thumb}
      ${topRank ? `<div class="badge-top">Top ${topRank}</div>` : ""}
      <div class="playbtn">${ICON_PLAY}</div>
      <div class="stat views">${ICON_EYE} ${fmt(p.views || 0)}</div>
      <div class="stat dls">${ICON_DL} ${fmt(p.downloads || 0)}</div>
    </div>
    <h3>${esc(p.title)}</h3>
    ${p.description ? `<div class="desc">${esc(p.description)}</div>` : ""}
    <button class="cta ${unlocked ? "done" : ""}" onclick="startUnlock(${p.id})" ${busy ? "disabled" : ""}>
      ${busy ? "Loading Ad..." : unlocked ? ICON_CHECK + " Watch & Download" : ICON_LOCK + ` Unlock Link (${prog}/${REQ})`}
    </button>
  </div>`;
}

/* ---------- Unlock flow ---------- */
const getProgress = id => Number(localStorage.getItem("unlock_" + id) || 0);
const setProgress = (id, v) => localStorage.setItem("unlock_" + id, String(v));
const viewedThisSession = new Set();

let adBusyPostId = null;
async function startUnlock(id) {
  const p = posts.find(x => x.id == id);
  if (!p || adBusyPostId) return;
  const REQ = settings.ads_required;
  if (!viewedThisSession.has(id)) {
    viewedThisSession.add(id);
    p.views = (p.views || 0) + 1;
    if (!DEMO) sb.rpc("increment_views", { post_id: p.id }).then(() => {});
  }
  if (getProgress(id) >= REQ) { goToLink(p); return; }

  // Directly load and show the real ad — no confirmation popup
  adBusyPostId = id; render();
  const done = () => { adBusyPostId = null; render(); };
  const fn = await waitForSdk();
  if (!fn) { done(); showToast("Ads are unavailable right now. Please try again in a moment."); return; }
  fn().then(() => {
    setProgress(id, getProgress(id) + 1);
    const prog = getProgress(id);
    done();
    if (prog >= REQ) {
      showToast(`All ${REQ} ads completed! Unlocking your link...`);
      setTimeout(() => goToLink(p), 900);
    } else {
      showToast(`${prog} of ${REQ} ads completed — ${REQ - prog} more to unlock`);
    }
  }).catch(() => { done(); showToast("Ad failed to load. Please try again."); });
}

async function goToLink(p) {
  if (!DEMO) sb.rpc("increment_downloads", { post_id: p.id }).then(() => {});
  p.downloads = (p.downloads || 0) + 1; render();
  if (tg?.openLink) tg.openLink(p.link_url); else window.open(p.link_url, "_blank");
}

/* ---------- Admin ---------- */
async function openAdmin() {
  if (DEMO) { document.getElementById("adminMain").style.display = ""; renderAdmin(); return; }
  document.getElementById("setAdsRequired").value = String(settings.ads_required);
  document.getElementById("setInApp").value = String(settings.inapp_ads);
  sb.auth.getSession().then(({ data }) => {
    if (data.session) { document.getElementById("adminMain").style.display = ""; document.getElementById("adminLogin").style.display = "none"; renderAdmin(); }
    else { document.getElementById("adminLogin").style.display = ""; document.getElementById("adminMain").style.display = "none"; }
  });
}
async function adminLogin() {
  const { error } = await sb.auth.signInWithPassword({
    email: document.getElementById("loginEmail").value.trim(),
    password: document.getElementById("loginPass").value
  });
  if (error) { showToast("Sign in failed: " + error.message); return; }
  showToast("Signed in"); openAdmin();
}
function renderAdmin() {
  document.getElementById("adminPosts").innerHTML = posts.map(p =>
    `<div class="admin-list-item"><div class="t">${esc(p.title)}</div>
      <button class="mini edit" onclick="openOverlay('postOverlay',()=>openPostForm(${p.id}))">Edit</button>
      <button class="mini del" onclick="deletePost(${p.id})">Delete</button></div>`).join("") || "<div class='empty'>No posts yet</div>";
  document.getElementById("adminCats").innerHTML = cats.map(c =>
    `<div class="admin-list-item"><div class="t">${esc(c.name)}</div>
      <button class="mini del" onclick="deleteCat(${c.id})">Delete</button></div>`).join("") || "<div class='empty'>No categories yet</div>";
}
function openPostForm(id) {
  const p = id ? posts.find(x => x.id == id) : null;
  document.getElementById("postFormTitle").textContent = p ? "Edit Post" : "New Post";
  document.getElementById("pfId").value = p ? p.id : "";
  document.getElementById("pfTitle").value = p?.title || "";
  document.getElementById("pfDesc").value = p?.description || "";
  document.getElementById("pfThumb").value = p?.thumbnail_url || "";
  document.getElementById("pfLink").value = p?.link_url || "";
  document.getElementById("pfTrending").value = String(p?.is_trending || false);
  document.getElementById("pfViews").value = p?.views || 0;
  document.getElementById("pfDls").value = p?.downloads || 0;
  document.getElementById("pfCat").innerHTML = `<option value="">— None —</option>` +
    cats.map(c => `<option value="${c.id}" ${p?.category_id == c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("");
}
async function savePost() {
  const id = document.getElementById("pfId").value;
  const row = {
    title: document.getElementById("pfTitle").value.trim(),
    description: document.getElementById("pfDesc").value.trim(),
    thumbnail_url: document.getElementById("pfThumb").value.trim(),
    link_url: document.getElementById("pfLink").value.trim(),
    category_id: document.getElementById("pfCat").value || null,
    is_trending: document.getElementById("pfTrending").value === "true",
    views: Number(document.getElementById("pfViews").value || 0),
    downloads: Number(document.getElementById("pfDls").value || 0)
  };
  if (!row.title || !row.link_url) { showToast("Title and link are required"); return; }
  if (DEMO) { showToast("Demo mode: connect Supabase first"); return; }
  const q = id ? sb.from("posts").update(row).eq("id", id) : sb.from("posts").insert(row);
  const { error } = await q;
  if (error) { showToast("Save failed: " + error.message); return; }
  showToast("Saved"); closeTopOverlay(); await loadData(); renderAdmin();
}
async function deletePost(id) {
  if (!confirm("Delete this post?")) return;
  if (DEMO) { showToast("Demo mode"); return; }
  const { error } = await sb.from("posts").delete().eq("id", id);
  if (error) { showToast("Delete failed: " + error.message); return; }
  await loadData(); renderAdmin();
}
function openCatForm() { document.getElementById("cfName").value = ""; }
async function saveCat() {
  const name = document.getElementById("cfName").value.trim();
  if (!name) return;
  if (DEMO) { showToast("Demo mode"); return; }
  const { error } = await sb.from("categories").insert({ name });
  if (error) { showToast("Save failed: " + error.message); return; }
  closeTopOverlay(); await loadData(); renderAdmin();
}
async function deleteCat(id) {
  if (!confirm("Delete this category?")) return;
  if (DEMO) { showToast("Demo mode"); return; }
  const { error } = await sb.from("categories").delete().eq("id", id);
  if (error) { showToast("Delete failed: " + error.message); return; }
  await loadData(); renderAdmin();
}

/* ---------- Start ---------- */
loadSettings().then(loadData);
</script>
