<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Family Lover BD</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    // --- CONFIGURATION ---
    const SUPABASE_URL = 'https://ibkuwmizjehwxljkypru.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlia3V3bWl6amVod3hsamt5cHJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NjUyNjYsImV4cCI6MjEwMDU0MTI2Nn0.wsygONI7Jq8JqtqRtXf2YtV0WUDU1JtU34V-1KTzbkU'
    const ADMIN_TELEGRAM_ID = '8717168026' 
    const MONETAG_ZONE_ID   = '11394615' 
    const ADS_REQUIRED      = 3 
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f3f4f6; transition: 0.3s; }
    body.dark-mode { background: #121212; color: white; }
    .no-scroll::-webkit-scrollbar { display: none; }
    .no-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    
    .featured-slider { display: flex; overflow-x: auto; gap: 12px; padding: 10px 15px; scroll-snap-type: x mandatory; }
    .slider-item { flex: 0 0 85%; scroll-snap-align: start; position: relative; border-radius: 15px; overflow: hidden; aspect-ratio: 16/9; cursor: pointer; }
    
    .unlock-btn { background: linear-gradient(90deg, #3b82f6, #1d4ed8); }
    .card-anim { animation: fadeInUp 0.4s ease forwards; }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(15px); } to { opacity:1; transform:translateY(0); } }
  </style>
</head>
<body>

<div id="app">
  <!-- HEADER -->
  <header id="header" class="sticky top-0 z-30 bg-white border-b px-4 py-3 flex items-center justify-between dark:bg-[#1a1a1a] dark:border-gray-800">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
        <svg width="12" height="12" viewBox="0 0 14 14"><polygon points="2,1 13,7 2,13" fill="white"/></svg>
      </div>
      <span id="logo-text" class="font-bold text-lg dark:text-white">Family Lover BD</span>
    </div>
    
    <div class="flex items-center gap-3">
       <button id="admin-btn" onclick="openAdmin()" class="hidden p-2 bg-gray-100 rounded-full dark:bg-gray-800">⚙️</button>
       <button onclick="toggleDark()" class="p-2 bg-gray-100 rounded-full dark:bg-gray-800">🌓</button>
    </div>
  </header>

  <!-- SEARCH BAR -->
  <div class="px-4 py-3">
    <div class="bg-white dark:bg-[#1e1e1e] flex items-center px-3 py-2 rounded-xl border dark:border-gray-700">
      <input type="text" id="search-input" oninput="handleSearch()" placeholder="Search videos..." class="bg-transparent w-full outline-none text-sm dark:text-white">
      <span class="text-gray-400">🔍</span>
    </div>
  </div>

  <!-- TRENDING SLIDER -->
  <div id="featured-section">
    <h3 class="px-4 text-sm font-bold text-gray-500 uppercase tracking-wider mb-1">Trending 🔥</h3>
    <div id="slider" class="featured-slider no-scroll"></div>
  </div>

  <!-- CATEGORIES -->
  <div id="filter-bar" class="flex gap-2 px-4 py-3 no-scroll overflow-x-auto">
    <button onclick="setCategory('all')" data-cat="all" class="cat-btn px-4 py-1.5 rounded-full text-xs font-bold bg-blue-600 text-white">All</button>
    <button onclick="setCategory('hot')" data-cat="hot" class="cat-btn px-4 py-1.5 rounded-full text-xs font-bold bg-white border dark:bg-gray-800 dark:border-gray-700">Hot 🌶️</button>
    <button onclick="setCategory('trending')" data-cat="trending" class="cat-btn px-4 py-1.5 rounded-full text-xs font-bold bg-white border dark:bg-gray-800 dark:border-gray-700">Viral 🚀</button>
  </div>

  <!-- MAIN FEED -->
  <div id="feed" class="px-4"></div>

  <!-- FOOTER -->
  <footer class="mt-10 py-10 text-center border-t border-gray-200 dark:border-gray-800 transition-colors">
    <p class="text-sm text-gray-500 dark:text-gray-400">© 2025 Family Lover BD. All Rights Reserved.</p>
    <p class="text-xs text-gray-400 dark:text-gray-600 mt-1 uppercase tracking-widest">Designed by Wanda</p>
  </footer>
</div>

<!-- AD SCREEN -->
<div id="ad-screen" class="hidden fixed inset-0 z-50 bg-white flex flex-col items-center justify-center p-6 dark:bg-[#0f172a]">
  <div id="ad-timer" class="mb-6 bg-black text-white px-6 py-2 rounded-full font-mono text-2xl font-bold">00:14</div>
  
  <div class="bg-gray-50 dark:bg-[#1e1e1e] w-full max-w-sm rounded-3xl border border-gray-100 dark:border-gray-700 shadow-2xl p-8 text-center">
    <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
      <span class="text-3xl">🎁</span>
    </div>
    <h2 class="text-xl font-bold mb-2 dark:text-white">Unlock Content</h2>
    <p class="text-gray-500 text-sm mb-8 leading-relaxed">Watch the ad completely to unlock your destination link. Please wait for the timer.</p>
    
    <button onclick="triggerMonetag()" class="w-full py-4 bg-orange-500 text-white rounded-2xl font-bold shadow-lg active:scale-95 transition-all">
       🚀 Show Ad & Unlock
    </button>
  </div>
  
  <button id="continue-btn" onclick="adComplete()" disabled class="mt-8 w-full max-w-sm py-4 bg-blue-600 text-white rounded-2xl font-bold opacity-50 cursor-not-allowed">
    Continue
  </button>
  <button onclick="closeAdScreen()" class="mt-4 text-gray-400 text-sm underline">Cancel</button>
</div>

<!-- ADMIN MODAL -->
<div id="admin-modal" class="hidden fixed inset-0 z-50 bg-white overflow-y-auto p-4 dark:bg-[#121212]">
  <div class="flex justify-between items-center mb-6 border-b pb-4">
    <h1 class="text-xl font-bold">Admin Panel ⚙️</h1>
    <button onclick="closeAdmin()" class="text-red-500 font-bold">Close ✖</button>
  </div>

  <div class="flex gap-2 mb-6">
    <button onclick="adminTab('add')" class="flex-1 py-2 bg-gray-100 rounded-lg text-sm font-bold dark:bg-gray-800">Add Post</button>
    <button onclick="adminTab('manage')" class="flex-1 py-2 bg-gray-100 rounded-lg text-sm font-bold dark:bg-gray-800">Manage All</button>
  </div>

  <div id="admin-add" class="space-y-4">
    <input id="f-title" type="text" placeholder="Video Title" class="w-full p-3 border rounded-xl dark:bg-gray-800 dark:border-gray-700">
    <input id="f-thumb" type="text" placeholder="Image Link" class="w-full p-3 border rounded-xl dark:bg-gray-800 dark:border-gray-700">
    <input id="f-url" type="text" placeholder="Video/Target Link" class="w-full p-3 border rounded-xl dark:bg-gray-800 dark:border-gray-700">
    <select id="f-cat" class="w-full p-3 border rounded-xl dark:bg-gray-800 dark:border-gray-700">
        <option value="all">Default</option>
        <option value="hot">Hot 🌶️</option>
        <option value="trending">Trending 🚀</option>
    </select>
    <button onclick="submitPost()" class="w-full py-4 bg-blue-600 text-white rounded-xl font-bold">Publish</button>
  </div>

  <div id="admin-manage" class="hidden space-y-4">
    <div id="admin-list"></div>
  </div>
</div>

<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let allPosts = [];
let currentUserId = 'unknown';
let currentAdPostId = null;
let adTimerInterval = null;
let adSeconds = 14;
let unlockProgress = {};

// Monetag Script Injection
(function() {
    const s = document.createElement('script');
    s.src = `https://groleegni.net/401/${MONETAG_ZONE_ID}`;
    s.async = true;
    document.head.appendChild(s);
})();

window.addEventListener('DOMContentLoaded', async () => {
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.expand();
    currentUserId = tg.initDataUnsafe?.user?.id?.toString() || 'unknown';
  }
  if (currentUserId === ADMIN_TELEGRAM_ID) document.getElementById('admin-btn').classList.remove('hidden');
  await loadPosts();
});

async function loadPosts() {
  const { data } = await sb.from('posts').select('*').eq('is_active', true).order('created_at', { ascending: false });
  if (data) {
    allPosts = data;
    renderSlider();
    renderFeed(allPosts);
    loadUnlockProgress();
  }
}

function renderSlider() {
  const slider = document.getElementById('slider');
  const trending = [...allPosts].sort((a, b) => (b.views || 0) - (a.views || 0)).slice(0, 5);
  slider.innerHTML = trending.map(p => `
    <div class="slider-item" onclick="openAdScreen(${p.id})">
      <img src="${p.thumbnail_url}" class="w-full h-full object-cover">
      <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent flex flex-col justify-end p-3">
        <h4 class="text-white text-sm font-bold line-clamp-1">${p.title}</h4>
        <p class="text-blue-400 text-[10px] font-bold">👁 ${p.views || 0} VIEWS</p>
      </div>
    </div>
  `).join('');
}

function renderFeed(posts) {
  const feed = document.getElementById('feed');
  feed.innerHTML = posts.map(p => `
    <div class="bg-white dark:bg-[#1e1e1e] rounded-2xl overflow-hidden mb-5 shadow-sm card-anim border border-gray-100 dark:border-gray-800">
      <div class="relative" onclick="openAdScreen(${p.id})">
        <img src="${p.thumbnail_url}" class="w-full aspect-video object-cover">
        <div class="absolute bottom-2 left-2 bg-black/60 text-white text-[10px] px-2 py-1 rounded-md">👁 ${p.views || 0} Views</div>
      </div>
      <div class="p-4">
        <h3 class="font-bold text-sm mb-3 line-clamp-2 dark:text-white">${p.title}</h3>
        <div id="btn-area-${p.id}">${getButtonHTML(p)}</div>
      </div>
    </div>
  `).join('');
}

function getButtonHTML(p) {
  const prog = unlockProgress[p.id] || { ad_count: 0, unlocked: false };
  if (prog.unlocked) {
    return `<a href="${p.target_url}" target="_blank" onclick="incrementCount(${p.id}, 'downloads')" class="block w-full py-3 bg-green-500 text-white text-center rounded-xl font-bold">Download / Watch Now</a>`;
  }
  return `<button onclick="openAdScreen(${p.id})" class="w-full py-3 unlock-btn text-white rounded-xl font-bold flex items-center justify-center gap-2">
    🔒 Unlock Link (${prog.ad_count}/${ADS_REQUIRED})
  </button>`;
}

function handleSearch() {
  const query = document.getElementById('search-input').value.toLowerCase();
  const filtered = allPosts.filter(p => p.title.toLowerCase().includes(query));
  renderFeed(filtered);
}

function setCategory(cat) {
  document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.classList.remove('bg-blue-600', 'text-white');
    if(btn.dataset.cat === cat) btn.classList.add('bg-blue-600', 'text-white');
  });
  const filtered = cat === 'all' ? allPosts : allPosts.filter(p => p.category === cat);
  renderFeed(filtered);
}

async function incrementCount(id, field) {
  const post = allPosts.find(p => p.id === id);
  if (post) {
    const newVal = (post[field] || 0) + 1;
    post[field] = newVal;
    await sb.from('posts').update({ [field]: newVal }).eq('id', id);
    if(field === 'views') renderSlider();
  }
}

function openAdScreen(postId) {
  currentAdPostId = postId;
  adSeconds = 14;
  incrementCount(postId, 'views');
  document.getElementById('ad-screen').classList.remove('hidden');
  const btn = document.getElementById('continue-btn');
  btn.disabled = true;
  btn.classList.add('opacity-50', 'cursor-not-allowed');
  clearInterval(adTimerInterval);
  adTimerInterval = setInterval(() => {
    adSeconds--;
    document.getElementById('ad-timer').textContent = `00:${adSeconds < 10 ? '0'+adSeconds : adSeconds}`;
    if (adSeconds <= 0) {
      clearInterval(adTimerInterval);
      btn.disabled = false;
      btn.classList.remove('opacity-50', 'cursor-not-allowed');
    }
  }, 1000);
  triggerMonetag();
}

function triggerMonetag() {
  if (typeof window.__monetag_onclick === 'function') {
      window.__monetag_onclick();
  }
}

async function adComplete() {
  const id = currentAdPostId;
  const prog = unlockProgress[id] || { ad_count: 0, unlocked: false };
  prog.ad_count++;
  if (prog.ad_count >= ADS_REQUIRED) prog.unlocked = true;
  unlockProgress[id] = prog;
  await sb.from('ad_watches').upsert({ telegram_user_id: currentUserId, post_id: id, ad_count: prog.ad_count, unlocked: prog.unlocked }, { onConflict: 'telegram_user_id,post_id' });
  renderFeed(allPosts);
  closeAdScreen();
}

function closeAdScreen() {
  document.getElementById('ad-screen').classList.add('hidden');
  clearInterval(adTimerInterval);
}

async function loadUnlockProgress() {
  if (currentUserId === 'unknown') return;
  const { data } = await sb.from('ad_watches').select('*').eq('telegram_user_id', currentUserId);
  if (data) {
    data.forEach(d => { unlockProgress[d.post_id] = { ad_count: d.ad_count, unlocked: d.unlocked }; });
    renderFeed(allPosts);
  }
}

function openAdmin() { document.getElementById('admin-modal').classList.remove('hidden'); }
function closeAdmin() { document.getElementById('admin-modal').classList.add('hidden'); }
function adminTab(tab) {
    document.getElementById('admin-add').classList.toggle('hidden', tab !== 'add');
    document.getElementById('admin-manage').classList.toggle('hidden', tab !== 'manage');
    if(tab === 'manage') loadAdminList();
}

async function submitPost() {
  const title = document.getElementById('f-title').value;
  const thumb = document.getElementById('f-thumb').value;
  const url = document.getElementById('f-url').value;
  const cat = document.getElementById('f-cat').value;
  if(!title || !thumb || !url) return alert("Fill all fields");
  const { error } = await sb.from('posts').insert([{ title, thumbnail_url: thumb, target_url: url, category: cat }]);
  if(!error) { alert("Published!"); location.reload(); }
}

async function loadAdminList() {
  const list = document.getElementById('admin-list');
  const { data } = await sb.from('posts').select('*').order('created_at', {ascending: false});
  list.innerHTML = data.map(p => `
    <div class="p-3 border rounded-xl mb-2 flex items-center gap-3 bg-gray-50 dark:bg-gray-800 dark:border-gray-700">
      <img src="${p.thumbnail_url}" class="w-12 h-12 rounded object-cover">
      <div class="flex-1">
        <p class="text-sm font-bold dark:text-white">${p.title}</p>
        <p class="text-[10px] text-gray-500">Views: ${p.views || 0}</p>
      </div>
      <button onclick="deletePost(${p.id})" class="text-red-500 text-sm">Delete</button>
    </div>
  `).join('');
}

async function deletePost(id) {
    if(confirm("Delete?")) { await sb.from('posts').delete().eq('id', id); loadAdminList(); }
}

function toggleDark() {
  document.documentElement.classList.toggle('dark');
  document.body.classList.toggle('dark-mode');
}
</script>
</body>
</html>
